org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Quality gates (detekt, ktlint, Android Lint) report findings without failing the build until
# the imported SableOS sources are clean. CI flips this with -Ptenseven.strictQuality=true once
# the repository variable TENSEVEN_STRICT_QUALITY is set to true (docs/BUILD.md, ROADMAP.md).
tenseven.strictQuality=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
