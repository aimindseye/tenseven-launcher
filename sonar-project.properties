# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
# The tests/ directory contains offline regression tests, not production code: classify it as tests
# so Python test harness lines do not dilute new-code coverage.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_tenseven-launcher
sonar.projectName=Tenseven Launcher

sonar.sources=.
sonar.tests=app/src/test,design/src/test,tests
sonar.test.inclusions=**/src/test/**,tests/**
sonar.exclusions=**/src/test/**,tests/**,**/build/**,**/.gradle/**,third_party/**,**/TablerGlyphPaths.kt,gradle/wrapper/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage comes from the Kover XML reports the Sonar workflow builds. Left out of the coverage measure:
# - Compose screens and sections, the generated Tabler glyph data, and the launcher theme (no JVM test can draw them);
# - Android platform glue: Activities, Services, receivers, system repositories, the icon pack loader and registry,
#   the sound profile applier, the notes controller, setup status, conversation access and its state store, the
#   game key handler, and the Hub's PendingIntent code (ConversationHub; its grouping and counting functions have tests);
# - the translatable string tables (*Text.kt), which are data;
# - the Python tools under tools/, which no coverage report covers.
# The testable logic (model, privacy, notes, games, calculator...) stays measured.
sonar.coverage.exclusions=**/ui/**,**/platform/**,**/*Activity.kt,**/*Activities.kt,**/*Service.kt,**/*Receiver.kt,design/**,**/extras/**/ui/**,**/extras/profiles/MainActivity.kt,**/*Screen.kt,**/*Screens.kt,**/SettingsSections.kt,**/extras/games/GameFrame.kt,**/extras/games/GameKeyHandler.kt,**/TablerGlyphPaths.kt,**/LauncherTheme.kt,**/iconpacks/IconPackLoader.kt,**/iconpacks/IconPacks.kt,**/extras/profiles/SoundProfileApplier.kt,**/extras/notes/NotesController.kt,**/onboarding/SetupStatus.kt,**/conversations/ConversationAccess.kt,**/conversations/ConversationStateStore.kt,**/conversations/ConversationHub.kt,**/*Text.kt,tools/**

# Translatable string tables (key to English, one per line) read as copy-paste to CPD because every
# line has the same shape, and the translations of the same strings. They are data, not duplicated logic.
sonar.cpd.exclusions=**/*Text.kt,**/*TextTest.kt,**/*Lines.kt,**/*LinesTest.kt,**/res/values*/strings.xml
