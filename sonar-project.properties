# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_tenseven-launcher
sonar.projectName=Tenseven Launcher

sonar.sources=.
sonar.tests=app/src/test,design/src/test
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/src/test/**,**/build/**,**/.gradle/**,third_party/**,**/TablerGlyphPaths.kt,gradle/wrapper/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage comes from the Kover XML reports the Sonar workflow builds. Compose screens and sections, the
# generated Tabler glyph data, and Android platform glue (Activities, Services, receivers, system repositories,
# the icon pack loader and the sound profile applier) can only be exercised on a device, so they are left out of
# the coverage measure; the testable logic (model, privacy, notes, games, calculator...) is not.
sonar.coverage.exclusions=**/ui/**,**/platform/**,**/*Activity.kt,**/*Service.kt,**/*Receiver.kt,design/**,**/extras/**/ui/**,**/extras/profiles/MainActivity.kt,**/*Screen.kt,**/*Screens.kt,**/SettingsSections.kt,**/extras/games/GameFrame.kt,**/TablerGlyphPaths.kt,**/iconpacks/IconPackLoader.kt,**/extras/profiles/SoundProfileApplier.kt

# Translatable string tables (key to English, one per line) read as copy-paste to CPD because every
# line has the same shape, and the translations of the same strings. They are data, not duplicated logic.
sonar.cpd.exclusions=**/*Text.kt,**/*TextTest.kt,**/*Lines.kt,**/*LinesTest.kt,**/res/values*/strings.xml
