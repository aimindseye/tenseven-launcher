# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_tenseven-launcher
sonar.projectName=Tenseven Launcher

sonar.sources=.
sonar.tests=app/src/test,design/src/test
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/src/test/**,**/build/**,**/.gradle/**,third_party/**,**/TablerGlyphPaths.kt,gradle/wrapper/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# No coverage reports are imported yet, so coverage is not measured: without this every line of new
# code counts as uncovered and the "Sonar way" gate (80% on new code) fails. Remove it once the workflow
# imports the Kover XML reports (ROADMAP.md).
sonar.coverage.exclusions=**/*

# Translatable string tables (key to English, one per line) read as copy-paste to CPD because every
# line has the same shape, and the translations of the same strings. They are data, not duplicated logic.
sonar.cpd.exclusions=**/*Text.kt,**/*TextTest.kt,**/*Lines.kt,**/*LinesTest.kt,**/res/values*/strings.xml
