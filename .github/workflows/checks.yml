name: checks

# Docs-only changes skip this workflow: no check here reads documentation.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck and xmllint
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils
      - name: Static checks
        run: bash tests/run.sh
