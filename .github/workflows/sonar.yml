name: SonarCloud

# CI-based SonarQube Cloud analysis. Turn Automatic Analysis off in the project's
# Administration > Analysis Method first, or the scan is refused. Needs the repository secret
# SONAR_TOKEN.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Pull requests from forks get no secrets, so they can't be analyzed here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for blame and new-code detection.
          fetch-depth: 0

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The quality gate only fails the job once TENSEVEN_STRICT_QUALITY is true (same switch as detekt,
          # ktlint and Lint); until then the analysis is uploaded and the gate result is read on SonarCloud.
          args: >
            -Dsonar.qualitygate.wait=${{ vars.TENSEVEN_STRICT_QUALITY == 'true' }}
            -Dsonar.qualitygate.timeout=300
