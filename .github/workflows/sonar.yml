name: SonarCloud

# CI-based SonarQube Cloud analysis. Turn Automatic Analysis off in the project's
# Administration > Analysis Method first, or the scan is refused. Needs the repository secret
# SONAR_TOKEN.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Pull requests from forks get no secrets, so they can't be analyzed here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for blame and new-code detection.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Sonar reads the Kover coverage (JaCoCo-format XML) and the Android Lint report, so build them first.
      # Lint reports without failing here (TENSEVEN_STRICT_QUALITY is not passed); the Android workflow owns that gate.
      - name: Build coverage and lint reports
        run: >-
          ./gradlew --no-daemon --console=plain --continue
          :design:koverXmlReportDebug :app:koverXmlReportDebug :app:lintDebug

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The job waits for the SonarCloud quality gate and fails when the gate fails. This is independent of
          # TENSEVEN_STRICT_QUALITY (which only governs detekt, ktlint and Lint).
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml,design/build/reports/kover/reportDebug.xml
            -Dsonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
